<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="toolcode — modular TUI coding harness">
	<title>toolcode</title>
	<defs>
		<!-- Brand gradient: theme.tsx colors.gradient -->
		<linearGradient id="tcGrad" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#7aa2f7"/>
			<stop offset="50%" stop-color="#bb9af7"/>
			<stop offset="100%" stop-color="#f7768e"/>
		</linearGradient>
		<linearGradient id="tcWord" gradientUnits="userSpaceOnUse" x1="330" y1="100" x2="880" y2="200">
			<stop offset="0%" stop-color="#7aa2f7"/>
			<stop offset="50%" stop-color="#bb9af7"/>
			<stop offset="100%" stop-color="#f7768e"/>
		</linearGradient>
	</defs>

	<!-- Plate -->
	<rect width="1200" height="320" rx="28" fill="#1a1b26"/>
	<rect x="2" y="2" width="1196" height="316" rx="26" fill="none" stroke="#414868" stroke-width="4"/>

	<!-- Mark (logo.svg scaled to 200px) -->
	<g transform="translate(60 60) scale(0.390625)">
		<rect x="104" y="136" width="304" height="240" rx="24" fill="#16161e" stroke="#414868" stroke-width="8"/>
		<path d="M104 196 H408" stroke="#414868" stroke-width="8"/>
		<circle cx="140" cy="166" r="11" fill="#f7768e"/>
		<circle cx="176" cy="166" r="11" fill="#e0af68"/>
		<circle cx="212" cy="166" r="11" fill="#9ece6a"/>
		<path d="M148 252 L184 292 L148 332" fill="none" stroke="url(#tcGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
		<rect x="216" y="272" width="34" height="40" rx="7" fill="url(#tcGrad)"/>
	</g>

	<!-- Wordmark -->
	<text x="330" y="162" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="96" font-weight="700" letter-spacing="-2" fill="url(#tcWord)">toolcode</text>
	<text x="336" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="27" letter-spacing="1.5" fill="#a9b1d6">modular TUI coding harness</text>
</svg>
